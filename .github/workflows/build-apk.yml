name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk PotionSort.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PotionSort-apk
          path: PotionSort.apk

      - name: Publish to "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Potion Sort (latest build)
          body: |
            Latest build from commit ${{ github.sha }}.
            Download **PotionSort.apk** below on your Android phone and open it to install
            (allow "Install unknown apps" for your browser/file manager when asked).
          prerelease: false
          make_latest: true
          files: PotionSort.apk
